name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: verify native libraries
        run: cd internal/dnssec && sha256sum -c SHA256SUMS --ignore-missing

      - name: gofmt
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "these files need gofmt -s:"
            echo "$files"
            exit 1
          fi

      - name: vet
        run: go vet $(go list ./... | grep -v internal/dnssec)

      - name: test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
